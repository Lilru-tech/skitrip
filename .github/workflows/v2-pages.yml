# SkiTrip v2 · publicación de la interfaz en GitHub Pages (https://lilru-tech.github.io/skitrip/).
# Publica SOLO la salida compilada de la interfaz (v2/dist-pages): nada de CSV, copias de D1, .env ni código del Worker.
# Variables públicas (Settings → Variables → Actions): VITE_API_BASE_URL (origen del Worker, sin ruta) y
# VITE_FIREBASE_API_KEY / VITE_FIREBASE_AUTH_DOMAIN / VITE_FIREBASE_PROJECT_ID. No usa secretos.
#
# Publicar requiere que Settings → Pages → Source sea «GitHub Actions». Mientras siga en «Deploy from a branch» (la web
# antigua), el job compila y verifica, pero NO publica: lo dice en el resumen. Vuelta atrás: volver a poner la rama.
name: v2 · publicar en Pages
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['v2/src/web/**', 'v2/src/core/**', 'v2/index.html', 'v2/public/**', 'v2/vite.config.ts', 'v2/package-lock.json', '.github/workflows/v2-pages.yml']
permissions:
  contents: read
concurrency:
  group: v2-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: v2
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    env:
      SKITRIP_TARGET: pages
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Build de Pages (falla si falta la configuración pública o apunta al emulador)
        run: npx vite build
      - name: Verificar el artefacto (solo interfaz compilada, sin datos ni configuración de pruebas)
        run: tools/verify-pages-artifact.sh dist-pages "$VITE_API_BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ¿Pages publica desde Actions?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Fuente de Pages: $bt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bt" = "workflow" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Pages publica desde «$bt»: se ha compilado y verificado, pero no se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.source.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist-pages
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar la web publicada (portada, recursos, CSP en meta y cabeceras reales)
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          sleep 20
          html=$(curl -sf "$URL")
          echo "$html" | grep -q 'http-equiv="Content-Security-Policy"'
          js=$(echo "$html" | grep -oE '/skitrip/assets/[^"]+\.js' | head -1)
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://lilru-tech.github.io$js")" = 200
          { echo "Publicado: $URL ($(date -u +%FT%TZ))"; echo '```'; curl -sI "$URL"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
