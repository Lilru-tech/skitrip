# SkiTrip v2 · limpiar una prueba de producción: borra de D1 los perfiles (y todo lo suyo) de UNA ejecución anterior de
# «v2 · comprobar producción» que quedó sin limpiar. Manual, solo para quien puede lanzar workflows del repositorio.
#
# Selecciona únicamente prod-check-<ejecución>-<letra>@example.com exactos, con rol «user», y no borra nada si alguno de
# sus viajes tiene personas ajenas a la prueba. Solo imprime recuentos.
name: v2 · limpiar prueba de producción
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Ejecución de «v2 · comprobar producción» (p. ej. 37124136929 o 37124136929-1)'
        required: true
      letters:
        description: 'Letras de las cuentas de prueba'
        required: true
        default: 'a,b,c'
permissions:
  contents: read
concurrency:
  group: v2-prod-check
  cancel-in-progress: false
defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail: un fallo dentro de una tubería falla el paso
    working-directory: v2
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      RUN_INPUT: ${{ inputs.run_id }}
      LETTERS_INPUT: ${{ inputs.letters }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configuración presente (sin ella no cuenta como limpiado)
        run: for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_PROJECT_ID; do [ -n "${!v}" ] || { echo "::error::Falta $v"; exit 1; }; done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Configuración de wrangler con la D1 real (solo en el disco del runner)
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="skitrip");process.stdout.write(d?d.uuid:"")')
          [ -n "$id" ] || { echo "::error::No existe la D1 «skitrip»"; exit 1; }
          node tools/deploy-config.mjs "$id" "$FIREBASE_PROJECT_ID"
          cp wrangler.deploy.jsonc wrangler.jsonc
      - name: Limpieza (la herramienta valida el id y las letras antes de consultar)
        run: npx tsx tools/prod-cleanup.ts --run "$RUN_INPUT" --letters "$LETTERS_INPUT" --remote 2>&1 | grep -v 'Proxy environment' | tee -a "$GITHUB_STEP_SUMMARY"
