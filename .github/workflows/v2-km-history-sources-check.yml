# SkiTrip v2 · investigación de fuentes para el histórico de km esquiables (solo lectura, sin secretos). Imprime en el
# registro qué partes de nieve guardó la Wayback Machine y cuántos días de temporada cubren (docs/KM-HISTORICO.md).
name: v2 · comprobar fuentes de km históricos
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/tools/km-history-sources-check.mjs'
      - 'v2/tools/km-history-esquiades-probe.ts'
      - '.github/workflows/v2-km-history-sources-check.yml'
permissions:
  contents: read
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx --yes tsx@4 tools/km-history-esquiades-probe.ts
  discover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/km-history-sources-check.mjs discover
