# SkiTrip v2 · batería completa de pruebas de UN commit (workflow reutilizable). La llaman «v2 · CI» (ramas y PR) y
# «v2 · publicar» (main y ejecuciones manuales), así que lo que se publica ha pasado exactamente estas pruebas en la
# misma ejecución y para el mismo SHA. Sin secretos: emuladores locales (Firebase Auth + workerd/D1). Nunca escribe en
# producción. Permisos de solo lectura.
name: v2 · pruebas
on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit exacto que se prueba'
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail: un fallo dentro de una tubería falla el paso
    working-directory: v2
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Comprobar que se prueba el commit pedido
        env:
          SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: actions/setup-java@v4   # requerido por el emulador de Firebase
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - name: Vitest (lógica, parsers, Worker + D1)
        run: npm test
      - name: Workflows (shell con pipefail, verificación del artefacto, marcador de Time Travel, alcance)
        run: npm run test:workflows
      - run: npm run build
      # Build de Pages con configuración ficticia (no se publica): base /skitrip/, CSP y sin restos del emulador.
      - name: Build de Pages (verificación)
        run: npx vite build && tools/verify-pages-artifact.sh dist-pages https://skitrip.ci.invalid
        env:
          SKITRIP_TARGET: pages
          VITE_API_BASE_URL: https://skitrip.ci.invalid
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
      - run: npx playwright install --with-deps chromium
      # Configuración local aislada y sin secretos en v2/test/e2e/env.ts. No usa .dev.vars. CI=1: servidores nuevos.
      - name: E2E (360 px, 390 px y escritorio; incluye el build de Pages servido en /skitrip/)
        run: test ! -e .dev.vars && npx playwright test
        env:
          CI: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: v2/test-results/
          retention-days: 3
