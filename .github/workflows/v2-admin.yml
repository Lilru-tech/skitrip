# SkiTrip v2 · dar o quitar el rol de administración por UID REAL de Firebase (nunca por alias).
# El UID se copia de Firebase Console → Authentication → Users (columna «UID del usuario») de la propia cuenta,
# después de haber entrado una vez en la web nueva (así existe el perfil). Manual; usa los secretos del despliegue.
name: v2 · administración (rol por UID)
on:
  workflow_dispatch:
    inputs:
      firebase_uid:
        description: 'UID de Firebase (Authentication → Users)'
        required: true
      role:
        description: 'Rol'
        required: true
        type: choice
        options: [admin, user]
permissions:
  contents: read
jobs:
  role:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      UID_IN: ${{ github.event.inputs.firebase_uid }}
      ROLE_IN: ${{ github.event.inputs.role }}
    steps:
      - name: Validar entrada y configuración
        working-directory: .
        run: |
          [[ "$UID_IN" =~ ^[A-Za-z0-9]{20,128}$ ]] || { echo "::error::UID no válido"; exit 1; }
          [[ "$ROLE_IN" == admin || "$ROLE_IN" == user ]] || { echo "::error::Rol no válido"; exit 1; }
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_PROJECT_ID; do [ -n "${!v}" ] || { echo "::error::Falta $v"; exit 1; }; done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Configuración de la D1 existente
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="skitrip");process.stdout.write(d?d.uuid:"")')
          [ -n "$id" ] || { echo "::error::No existe la D1 skitrip: despliega antes la API"; exit 1; }
          node tools/deploy-config.mjs "$id" "$FIREBASE_PROJECT_ID"
      - name: Cambiar el rol (UID ya validado, solo letras y números)
        run: |
          out=$(npx wrangler d1 execute skitrip --remote -c wrangler.deploy.jsonc --json --command "UPDATE users SET role = '$ROLE_IN', updated_at = unixepoch() * 1000 WHERE firebase_uid = '$UID_IN'; SELECT alias, role FROM users WHERE firebase_uid = '$UID_IN';")
          n=$(echo "$out" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(String(r[0].meta.changes??0))')
          [ "$n" = 1 ] || { echo "::error::Ningún perfil con ese UID: entra antes una vez en la web con esa cuenta."; exit 1; }
          echo "$out" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));const u=r[1].results[0];console.log(`Perfil ${u.alias}: rol ${u.role}`)' | tee -a "$GITHUB_STEP_SUMMARY"
