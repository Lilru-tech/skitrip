# SkiTrip v2 · despliegue de la API (Cloudflare Worker + D1, plan Free) desde Actions.
# Secretos (Settings → Secrets → Actions): CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + D1: Edit, solo esta cuenta),
# CLOUDFLARE_ACCOUNT_ID y SKITRIP_INGEST_TOKEN. Variable: VITE_FIREBASE_PROJECT_ID (pública).
# Nunca imprime secretos ni sube copias de datos como artefacto (los artefactos de un repo público son descargables).
# Copia de datos: D1 Time Travel (incluido en Free, 7 días) — el job registra el marcador anterior a las migraciones.
name: v2 · desplegar API
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['v2/src/worker/**', 'v2/src/core/**', 'v2/migrations/**', 'v2/wrangler.jsonc', '.github/workflows/v2-deploy-api.yml']
permissions:
  contents: read
concurrency:
  group: v2-deploy-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKITRIP_INGEST_TOKEN: ${{ secrets.SKITRIP_INGEST_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - name: 'Comprobar configuración (falla si falta: un despliegue omitido no cuenta como probado)'
        working-directory: .
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SKITRIP_INGEST_TOKEN FIREBASE_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Falta configuración:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: D1 · reutilizar o crear «skitrip»
        id: d1
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="skitrip");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create skitrip > /dev/null
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="skitrip").uuid)')
            echo "D1 creada: $id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "D1 existente: $id" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          node tools/deploy-config.mjs "$id" "$FIREBASE_PROJECT_ID"
      - name: D1 · marcador de Time Travel antes de migrar (para restaurar)
        run: |
          npx wrangler d1 time-travel info skitrip -c wrangler.deploy.jsonc | tee -a "$GITHUB_STEP_SUMMARY"
      - name: D1 · migraciones
        run: npx wrangler d1 migrations apply skitrip --remote -c wrangler.deploy.jsonc
      - name: Worker · desplegar
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy -c wrangler.deploy.jsonc | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No se encontró la URL de workers.dev"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Worker · secreto de ingesta (desde stdin, sin imprimirlo)
        run: printf '%s' "$SKITRIP_INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN -c wrangler.deploy.jsonc > /dev/null
      - name: Comprobación en vivo (salud, CORS de Pages, rechazo de otros orígenes y de peticiones sin token)
        env:
          API: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/health")" = 200
          h=$(curl -s -D - -o /dev/null -X OPTIONS "$API/api/trips" -H 'Origin: https://lilru-tech.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')
          echo "$h" | grep -qi '^access-control-allow-origin: https://lilru-tech.github.io' || { echo "$h"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$API/api/trips" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/trips" -H 'Origin: https://lilru-tech.github.io')" = 401
          echo "Comprobación en vivo correcta: $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
