# SkiTrip v2 · comprobación externa de fuentes meteorológicas y de afluencia (solo lectura). Sin secretos, no escribe en
# la API ni en D1; imprime el resultado en el registro (el contenedor de desarrollo no puede descargar artefactos).
# Se ejecuta a mano o cuando cambia la herramienta en una PR (docs/METEO-AFLUENCIA.md).
name: v2 · comprobar fuentes meteo y afluencia
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'v2/tools/weather-sources-check.ts'
      - '.github/workflows/v2-weather-sources-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes tsx@4 tools/weather-sources-check.ts
