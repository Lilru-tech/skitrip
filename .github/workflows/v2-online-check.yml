# SkiTrip v2 · comprobación online de fuentes (solo lectura). Manual. No usa secretos, no escribe en la API ni en D1.
# El registro JSON queda como artefacto privado de la ejecución durante 7 días; el HTML NO se guarda aquí.
name: v2 · comprobar fuentes online
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Texto contenido en el id de la fuente (vacío = todas)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - env:
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          mkdir -p diag
          npx tsx tools/online-check.ts "$FILTER" > diag/online-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-check
          path: v2/diag/
          retention-days: 7
