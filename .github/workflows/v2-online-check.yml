# SkiTrip v2 · comprobación online de fuentes (solo lectura). Manual. No usa secretos, no escribe en la API ni en D1.
# El registro JSON (solo URLs y resultados de fuentes públicas, sin datos de usuarios) queda como artefacto de la
# ejecución durante 7 días. En un repositorio público los artefactos son descargables: el HTML completo NO se guarda.
# Con «fixtures» se guardan además fragmentos reducidos y saneados de esas páginas públicas (sin scripts ni parámetros
# de URL) para convertirlos en fixtures reales de los tests.
name: v2 · comprobar fuentes online
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Texto contenido en el id de la fuente (vacío = todas)'
        required: false
        default: ''
      fixtures:
        description: 'Guardar fixtures reducidos y saneados de cada página'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash   # bash --noprofile --norc -eo pipefail: un fallo dentro de una tubería falla el paso
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - env:
          FILTER: ${{ inputs.filter }}
          FIXTURES: ${{ inputs.fixtures }}
        run: |
          mkdir -p diag
          extra=()
          if [ "$FIXTURES" = "true" ]; then extra=(--fixtures diag/fixtures); fi
          npx tsx tools/online-check.ts "$FILTER" "${extra[@]}" > diag/online-check.json
      - name: Resultado por fuente (registro y resumen; sin el HTML)
        if: always()
        run: |
          [ -s diag/online-check.json ] || exit 0
          node -e '
            const log = JSON.parse(require("fs").readFileSync("diag/online-check.json", "utf8"));
            const rows = log.map((l) => `| ${l.id} | ${l.catalogStatus} | ${l.transport} | ${l.verdict ?? ""} | ${l.rows ?? ""} | ${(l.error ?? l.note ?? "").replace(/[|\n]/g, " ").slice(0, 420)} |`);
            console.log(["| Fuente | Catálogo | Transporte | Extracción | Filas | Nota |", "|---|---|---|---|---|---|", ...rows].join("\n"));
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-check
          path: v2/diag/
          retention-days: 7
