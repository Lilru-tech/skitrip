# SkiTrip v2 · publicar (API en Cloudflare + interfaz en GitHub Pages) desde UN commit probado en esta misma ejecución.
#
#   alcance → pruebas del SHA (typecheck, Vitest, workflows, build de Pages, Playwright)
#           → API: D1, marcador de Time Travel, migraciones, catálogo e históricos, Worker, comprobación en vivo
#           → Pages: build con la configuración real, verificación del artefacto, publicación y comprobación
#
# Cada etapa necesita la anterior en verde y usa el mismo SHA; nunca se apoya en una CI verde de otro commit. Una
# ejecución manual pasa por las mismas pruebas. Solo se publica desde main.
# Secretos (Settings → Secrets → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SKITRIP_INGEST_TOKEN.
# Variables públicas: VITE_API_BASE_URL y VITE_FIREBASE_API_KEY / _AUTH_DOMAIN / _PROJECT_ID.
# Nunca imprime secretos ni sube copias de datos como artefacto (los artefactos de un repo público son descargables).
#
# La web antigua sigue publicada mientras Settings → Pages → Source sea «Deploy from a branch»: entonces la etapa de
# Pages compila y verifica, pero NO publica (lo dice en el resumen). Vuelta atrás: DEPLOY.md.
name: v2 · publicar
on:
  push:
    branches: [main]
    paths: ['v2/**', 'data/*.json', '.github/workflows/v2-*.yml']
  workflow_dispatch:
    inputs:
      api:
        description: 'Desplegar la API (D1, migraciones, importación y Worker)'
        type: boolean
        default: true
      pages:
        description: 'Publicar la interfaz en Pages'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: v2-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail: un fallo dentro de una tubería falla el paso
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      pages: ${{ steps.scope.outputs.pages }}
    steps:
      - name: Solo desde main
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = refs/heads/main ] || { echo "::error::Solo se publica desde main (ejecución en $REF)"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ¿Qué cambia? (las pruebas se ejecutan siempre)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_API: ${{ inputs.api }}
          IN_PAGES: ${{ inputs.pages }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            printf 'api=%s\npages=%s\n' "$IN_API" "$IN_PAGES" | tee -a "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" | node v2/tools/release-scope.mjs | tee -a "$GITHUB_OUTPUT"
          else
            node v2/tools/release-scope.mjs --all < /dev/null | tee -a "$GITHUB_OUTPUT"
          fi
          { echo "Commit: $GITHUB_SHA"; cat "$GITHUB_OUTPUT"; } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: scope
    uses: ./.github/workflows/v2-verify.yml
    with:
      sha: ${{ github.sha }}

  api:
    needs: [scope, verify]
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SKITRIP_INGEST_TOKEN: ${{ secrets.SKITRIP_INGEST_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - name: 'Comprobar configuración (falla si falta: un despliegue omitido no cuenta como probado)'
        working-directory: .
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SKITRIP_INGEST_TOKEN FIREBASE_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Falta configuración:$missing"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: D1 · reutilizar o crear «skitrip»
        id: d1
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="skitrip");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create skitrip > /dev/null
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="skitrip").uuid)')
            echo "D1 creada: $id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "D1 existente: $id" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          node tools/deploy-config.mjs "$id" "$FIREBASE_PROJECT_ID"
      - name: D1 · marcador de Time Travel antes de migrar (sin marcador no se migra)
        id: bookmark
        run: |
          out=$(npx wrangler d1 time-travel info skitrip -c wrangler.deploy.jsonc)
          bookmark=$(grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}' <<<"$out" || true)
          [ -n "$bookmark" ] || { printf '%s\n' "$out"; echo "::error::No se obtuvo el marcador de Time Travel: no se migra."; exit 1; }
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          echo "Marcador de Time Travel antes de migrar: \`$bookmark\` (restaurar: npx wrangler d1 time-travel restore skitrip --bookmark=$bookmark)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: D1 · migraciones
        run: npx wrangler d1 migrations apply skitrip --remote -c wrangler.deploy.jsonc
      - name: D1 · catálogo e históricos de la web antigua (reejecutable, sin duplicar)
        run: |
          npx tsx tools/import-legacy.ts --ref HEAD --apply remote --config wrangler.deploy.jsonc
          node -e 'const r=require("./exports/legacy-import-report.json");console.log("Importación legacy: "+JSON.stringify(r.totals)+" · commit "+r.commit)' >> "$GITHUB_STEP_SUMMARY"
      - name: Worker · desplegar
        id: deploy
        run: |
          npx wrangler deploy -c wrangler.deploy.jsonc | tee deploy.log
          url=$(grep -m1 -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log || true)
          [ -n "$url" ] || { echo "::error::No se encontró la URL de workers.dev"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Worker · secreto de ingesta (desde stdin, sin imprimirlo)
        run: printf '%s' "$SKITRIP_INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN -c wrangler.deploy.jsonc > /dev/null
      - name: Comprobación en vivo (salud, CORS de Pages, rechazo de otros orígenes y de peticiones sin token)
        env:
          API: ${{ steps.deploy.outputs.url }}
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/health")" = 200
          h=$(curl -s -D - -o /dev/null -X OPTIONS "$API/api/trips" -H 'Origin: https://lilru-tech.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')
          grep -qi '^access-control-allow-origin: https://lilru-tech.github.io' <<<"$h" || { echo "$h"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$API/api/trips" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API/api/trips" -H 'Origin: https://lilru-tech.github.io')" = 401
          echo "Comprobación en vivo correcta: $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"

  pages-build:
    needs: [scope, verify, api]
    # La API va antes: si tocaba desplegarla, tiene que haber terminado bien. Si no tocaba (omitida), se publica igual.
    if: ${{ !cancelled() && needs.scope.outputs.pages == 'true' && needs.verify.result == 'success' && (needs.api.result == 'success' || needs.api.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: v2
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    env:
      SKITRIP_TARGET: pages
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Build de Pages (falla si falta la configuración pública o apunta al emulador)
        run: npx vite build
      - name: Verificar el artefacto (solo interfaz compilada, sin datos ni configuración de pruebas)
        id: verify-artifact
        run: tools/verify-pages-artifact.sh dist-pages "$VITE_API_BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: ¿Pages publica desde Actions?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          bt=$(gh api "repos/$REPO/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Fuente de Pages: $bt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bt" = "workflow" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Pages publica desde «$bt»: se ha compilado y verificado, pero no se publica."
            echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.source.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist-pages

  pages-deploy:
    needs: pages-build
    if: ${{ !cancelled() && needs.pages-build.result == 'success' && needs.pages-build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar la web publicada (portada, recursos, CSP en meta y cabeceras reales)
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # Con pipefail, `echo … | grep -q` puede fallar por SIGPIPE: se usa <<< en su lugar.
          sleep 20
          html=$(curl -sf "$URL")
          grep -q 'http-equiv="Content-Security-Policy"' <<<"$html"
          js=$(grep -m1 -oE '/skitrip/assets/[^"]+\.js' <<<"$html")
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://lilru-tech.github.io$js")" = 200
          { echo "Publicado: $URL ($(date -u +%FT%TZ))"; echo '```'; curl -sI "$URL"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
