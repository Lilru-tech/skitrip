# SkiTrip v2 · comprobar producción: recorrido real en https://lilru-tech.github.io/skitrip/ con la API y Firebase de
# producción. Dos recorridos, cada uno en su propio trabajo y uno detrás de otro (el alta está limitada a 5 cuentas
# por IP y hora, y el recuento de perfiles de antes y después no debe mezclarse):
#   · smoke (cuentas a-c): registro, acceso, privacidad, amigos, viaje, calendario, compra y gastos.
#   · calendario (cuentas d-f): amistad, disponibilidades distintas, compartir, coincidencias y detalle, propuesta de
#     fechas y su uso en el viaje, compartir solo con un viaje, revocación y acceso ajeno rechazado.
#
# Es manual a propósito: crea cuentas de prueba identificables (prod-check-<ejecución>-<intento>-<letra>@example.com).
# Al terminar, pase o falle, la prueba borra su viaje y sus cuentas de Firebase, y el paso «Limpieza de D1» borra sus
# perfiles y todo lo suyo con tools/prod-cleanup.ts: por los correos exactos y UID que la ejecución anotó en su
# manifiesto, solo rol «user» y sin tocar viajes con personas ajenas. Después comprueba que el número de perfiles
# vuelve al de antes. El token de Cloudflare solo lo usa ese paso; la web y la API se prueban con la configuración pública.
# Las pruebas locales no cuentan como verificación de producción.
name: v2 · comprobar producción
on:
  workflow_dispatch:
    inputs:
      recorrido:
        description: 'Qué recorrido ejecutar'
        type: choice
        options: [todos, smoke, calendario]
        default: todos
permissions:
  contents: read
concurrency:
  group: v2-prod-check
  cancel-in-progress: false
defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail: un fallo dentro de una tubería falla el paso
    working-directory: v2
jobs:
  smoke:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        spec: ${{ fromJSON(inputs.recorrido == 'smoke' && '["smoke"]' || inputs.recorrido == 'calendario' && '["calendar"]' || '["smoke","calendar"]') }}
    name: ${{ matrix.spec }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC: ${{ matrix.spec }}
      LETTERS: ${{ matrix.spec == 'smoke' && 'a,b,c' || 'd,e,f' }}
      PROD_URL: https://lilru-tech.github.io/skitrip/
      PROD_API: ${{ vars.VITE_API_BASE_URL }}
      FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ficheros temporales fuera del repositorio (el contexto runner no existe en el env del job)
        run: |
          {
            echo "CLEANUP_MANIFEST=$RUNNER_TEMP/cleanup-manifest.json"
          } >> "$GITHUB_ENV"
      - name: Configuración pública presente (sin ella no se ejecuta nada)
        run: |
          [ -n "$PROD_API" ] || { echo "::error::Falta la Variable VITE_API_BASE_URL"; exit 1; }
          [ -n "$FIREBASE_API_KEY" ] || { echo "::error::Falta la Variable VITE_FIREBASE_API_KEY"; exit 1; }
          echo "Web: $PROD_URL · API: $PROD_API · commit de las pruebas: $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Configuración de wrangler con la D1 real (solo en el disco del runner)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIREBASE_PROJECT_ID; do [ -n "${!v}" ] || { echo "::error::Falta $v"; exit 1; }; done
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="skitrip");process.stdout.write(d?d.uuid:"")')
          [ -n "$id" ] || { echo "::error::No existe la D1 «skitrip»"; exit 1; }
          node tools/deploy-config.mjs "$id" "$FIREBASE_PROJECT_ID"
          cp wrangler.deploy.jsonc wrangler.jsonc
          n=$(npx wrangler d1 execute skitrip --remote --json --command "SELECT COUNT(*) AS n FROM users" | jq '.[0].results[0].n')
          echo "PROFILES_BEFORE=$n" >> "$GITHUB_ENV"
          echo "Perfiles en D1 antes del recorrido: $n" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - name: Recorrido en producción
        id: smoke
        run: |
          status=0
          npx playwright test -c playwright.prod.config.ts "test/prod/$SPEC.spec.ts" > prod-check.log 2>&1 || status=$?
          cat prod-check.log
          { echo '```'; grep -E '✓|✘|passed|failed|skipped|limpieza' prod-check.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = 0 ] || exit "$status"
          # Un recorrido omitido no cuenta como comprobado.
          if grep -qE '[0-9]+ skipped' prod-check.log || ! grep -qE '1 passed' prod-check.log; then echo "::error::El recorrido se omitió o no se ejecutó"; exit 1; fi
      - name: Limpieza de D1 (pase o falle el recorrido)
        if: always() && env.PROFILES_BEFORE != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sin manifiesto (fallo antes de la prueba) se limpia por los correos exactos de esta ejecución.
          if [ -f "$CLEANUP_MANIFEST" ]; then args=(--manifest "$CLEANUP_MANIFEST"); else args=(--run "$RUN_ID" --letters "$LETTERS"); fi
          npx tsx tools/prod-cleanup.ts "${args[@]}" --remote 2>&1 | grep -v 'Proxy environment' | tee -a "$GITHUB_STEP_SUMMARY"
          n=$(npx wrangler d1 execute skitrip --remote --json --command "SELECT COUNT(*) AS n FROM users" | jq '.[0].results[0].n')
          echo "Perfiles en D1 después de limpiar: $n (antes: $PROFILES_BEFORE)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n" = "$PROFILES_BEFORE" ] || { echo "::error::El número de perfiles no ha vuelto al de antes"; exit 1; }
